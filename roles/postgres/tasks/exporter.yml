- name: Create exporter DB role
  community.postgresql.postgresql_user:
    name: "{{ postgres__exporter_db_user }}"
    password: "{{ postgres__exporter_db_password }}"
  become: true
  become_user: postgres
  no_log: true

- name: Grant pg_monitor to exporter role
  community.postgresql.postgresql_membership:
    groups: pg_monitor
    target_roles: "{{ postgres__exporter_db_user }}"
    state: present
  become: true
  become_user: postgres

- name: Create exporter system user
  ansible.builtin.user:
    name: "{{ __exporter_os_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create work dir on controller
  ansible.builtin.file:
    path: "{{ __exporter_workdir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Download exporter archive
  ansible.builtin.get_url:
    url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgres__exporter_version }}/{{ __exporter_archive }}.tar.gz"
    dest: "{{ __exporter_workdir }}/{{ __exporter_archive }}.tar.gz"
    checksum: "sha256:https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ postgres__exporter_version }}/sha256sums.txt"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Unpack exporter on controller
  ansible.builtin.unarchive:
    src: "{{ __exporter_workdir }}/{{ __exporter_archive }}.tar.gz"
    dest: "{{ __exporter_workdir }}"
    remote_src: true
    creates: "{{ __exporter_workdir }}/{{ __exporter_archive }}/postgres_exporter"
  delegate_to: localhost
  become: false

- name: Copy exporter binary to target
  ansible.builtin.copy:
    src: "{{ __exporter_workdir }}/{{ __exporter_archive }}/postgres_exporter"
    dest: /usr/local/bin/postgres_exporter
    owner: root
    group: root
    mode: "0755"
  notify: restart exporter

- name: Install exporter env file
  ansible.builtin.template:
    src: postgres-exporter.env.j2
    dest: /etc/postgres_exporter.env
    owner: root
    group: "{{ __exporter_os_user }}"
    mode: "0640"
  no_log: true
  notify: restart exporter

- name: Install exporter systemd unit
  ansible.builtin.template:
    src: postgres-exporter.service.j2
    dest: "/etc/systemd/system/{{ __exporter_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - daemon_reload
    - restart exporter

- name: Apply pending handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start exporter
  ansible.builtin.systemd:
    name: "{{ __exporter_service }}"
    state: started
    enabled: true

- name: Check exporter reports pg_up 1
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ postgres__exporter_port }}/metrics"
    return_content: true
  register: __exporter_metrics
  until: "'pg_up 1' in __exporter_metrics.content"
  retries: 10