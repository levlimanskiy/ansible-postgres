- name: daemon_reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart postgres
  ansible.builtin.systemd:
    name: "{{ __pg_service }}"
    state: restarted

- name: reload postgres
  ansible.builtin.systemd:
    name: "{{ __pg_service }}"
    state: reloaded

- name: restart exporter
  ansible.builtin.systemd:
    name: "{{ __exporter_service }}"
    state: restarted